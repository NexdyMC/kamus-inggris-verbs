<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Verb Master | Dark Mode</title>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        table { width: 90%; border-collapse: collapse; background: #1e1e1e; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        th { background: #333; color: #4caf50; padding: 15px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #333; }
        tr:hover { background: #2a2a2a; }
        .tag { padding: 4px 8px; border-radius: 4px; font-size: 0.8em; text-transform: uppercase; }
        .regular { background: #1b5e20; color: #81c784; }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr><th>V1</th><th>V2</th><th>V3</th><th>V-ing</th><th>Arti</th><th>Type</th></tr>
        </thead>
        <tbody id="verb-table"></tbody>
    </table>

    <script src="/js/script.js"></script>
</body>
</html>
